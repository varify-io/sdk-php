services:
  php:
    build:
      context: docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    extra_hosts:
      - host.docker.internal:host-gateway

  example:
    extends: php
    command: php -S 0.0.0.0:8080 -t examples/plain-php
    ports:
      - '8080:8080'
    env_file:
      - path: examples/plain-php/.env
        required: false

volumes:
  composer-cache:
