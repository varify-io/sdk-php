workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - test

variables:
  # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
  TRIVY_VERSION: 0.74.0
  # renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks
  BETTERLEAKS_VERSION: 1.8.1

default:
  interruptible: true

.php:
  image: php:${PHP_VERSION}-cli
  variables:
    PHP_VERSION: '8.2'
    COMPOSER_CACHE_DIR: '$CI_PROJECT_DIR/.composer-cache'
  cache:
    key: composer-$PHP_VERSION
    paths:
      - .composer-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip
    - curl -sSLo /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions && install-php-extensions gd intl pdo_mysql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress

test:lint:
  extends: .php
  stage: test
  script:
    - composer lint

test:unit:
  extends: .php
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ['8.2', '8.3', '8.4', '8.5']
  script:
    - composer test

test:audit:
  extends: .php
  stage: test
  script:
    - composer audit --no-dev

# Dev tooling never reaches customers, so its advisories are reported without blocking a release.
test:audit:dev:
  extends: .php
  stage: test
  allow_failure: true
  script:
    - composer audit

betterleaks:
  stage: test
  image:
    name: ghcr.io/betterleaks/betterleaks:v$BETTERLEAKS_VERSION
    entrypoint: ['']
  needs: []
  variables:
    GIT_DEPTH: 0
  script:
    - betterleaks git . --no-banner -v --redact=100 --log-opts=HEAD

trivy-secrets:
  stage: test
  image:
    name: ghcr.io/aquasecurity/trivy:$TRIVY_VERSION
    entrypoint: ['']
  needs: []
  variables:
    TRIVY_CACHE_DIR: .tools/cache/trivy
    TRIVY_NO_PROGRESS: 'true'
  cache:
    - key: trivy-db-$TRIVY_VERSION
      when: always
      paths:
        - .tools/cache/trivy/
  script:
    - trivy filesystem --scanners secret
      --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      --secret-config .trivy/secret-config.yaml
      --table-mode detailed
      .
